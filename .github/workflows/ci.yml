name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test Python service
        working-directory: python-service
        run: python -m unittest discover -s tests -v

      - name: Test Node.js service
        run: npm test --prefix node-service

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Smoke-test both containers
        shell: bash
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:8001/health http://127.0.0.1:3001/health; do
            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent --show-error "$url"; then
                printf '\n'
                ready=true
                break
              fi
              sleep 2
            done
            if [[ "$ready" != true ]]; then
              docker compose logs
              exit 1
            fi
          done

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
